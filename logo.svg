<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradients -->
  <defs>
    <linearGradient id="honeycombGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="codeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00AA66;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
  
  <!-- Honeycomb structure - left side -->
  <!-- Center hexagon -->
  <polygon points="70,80 80,75 90,80 90,95 80,100 70,95" fill="url(#honeycombGradient)" stroke="#FF8C00" stroke-width="1.5"/>
  
  <!-- Top-left hexagon -->
  <polygon points="55,65 65,60 75,65 75,80 65,85 55,80" fill="#FFD700" stroke="#FF8C00" stroke-width="1.5"/>
  
  <!-- Top-right hexagon -->
  <polygon points="85,65 95,60 105,65 105,80 95,85 85,80" fill="#FFA500" stroke="#FF8C00" stroke-width="1.5"/>
  
  <!-- Bottom-left hexagon -->
  <polygon points="55,95 65,90 75,95 75,110 65,115 55,110" fill="#FFA500" stroke="#FF8C00" stroke-width="1.5"/>
  
  <!-- Bottom-right hexagon -->
  <polygon points="85,95 95,90 105,95 105,110 95,115 85,110" fill="#FFD700" stroke="#FF8C00" stroke-width="1.5"/>
  
  <!-- Bottom center hexagon -->
  <polygon points="70,110 80,105 90,110 90,125 80,130 70,125" fill="#FF8C00" stroke="#FF8C00" stroke-width="1.5"/>
  
  <!-- Code symbols - right side with brackets -->
  <!-- Left angle bracket -->
  <path d="M 115 75 L 125 85 L 115 95" stroke="url(#codeGradient)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right angle bracket -->
  <path d="M 135 75 L 125 85 L 135 95" stroke="url(#codeGradient)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Code forward slashes -->
  <line x1="110" y1="105" x2="120" y2="120" stroke="url(#codeGradient)" stroke-width="2" stroke-linecap="round"/>
  <line x1="130" y1="105" x2="140" y2="120" stroke="url(#codeGradient)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Decorative dots representing data points -->
  <circle cx="115" cy="60" r="2" fill="#0066CC"/>
  <circle cx="130" cy="60" r="2" fill="#00AA66"/>
  <circle cx="122" cy="130" r="2" fill="#0066CC"/>
  
  <!-- CodeHive text -->
  <text x="100" y="155" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">CodeHive</text>
  
  <!-- Subtitle -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Collaborative Coding</text>
</svg>