spring:
  datasource: # 单数据源配置
    # 注意：${database.name} 会读取 application.yml 里的配置 (pai_coding)
    url: jdbc:mysql://localhost:3306/${database.name}?useUnicode=true&allowPublicKeyRetrieval=true&autoReconnect=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    # 👇👇👇 关键修改：这里必须填 Docker 容器的密码 123456 👇👇👇
    password: "123456"

  dynamic: # 动态数据源配置
    datasource:
      master:
        url: jdbc:mysql://localhost:3306/${database.name}?useUnicode=true&allowPublicKeyRetrieval=true&autoReconnect=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
        username: root
        # 👇👇👇 关键修改：Master 库密码也要改 👇👇👇
        password: "123456"
        filters: stat
        initialSize: 0
        minIdle: 1
        maxActive: 200
        maxWait: 10000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 200000
        testWhileIdle: true
        testOnBorrow: true
        validationQuery: select 1
      slave:
        url: jdbc:mysql://localhost:3306/${database.name}?useUnicode=true&allowPublicKeyRetrieval=true&autoReconnect=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
        username: root
        # 👇👇👇 关键修改：Slave 库密码也要改 👇👇👇
        password: "123456"

  redis:
    host: localhost
    port: 6379
    password:

# elasticsearch配置
elasticsearch:
  open: false # 本地开发没装 ES 的话，这里 false 是对的
  clusterName: elasticsearch
  hosts: 127.0.0.1:9200
  scheme: http
  connectTimeOut: 1000
  socketTimeOut: 30000